id: website
version: v1
domain: website
# Session expert = load this pack into the interview session (read).
# Never dump pack body into the target workspace.
# Every accepted experience_level 0–5 has an explicit entry (no clamp, no gaps).
core_slots:
  - start_mode          # rebuild vs new / brief / live rebuild / both
  - existing_url_dns    # where site lives / DNS / hosting owner
  - stack               # Astro or Next
  - host                # Cloudflare / own VPS / their host
  - content             # files/markdown vs CMS / keep old CMS
  - figma               # whole file vs few screens
  - shipped_live        # what "live" means
  - a11y                # accessibility bar
levels:
  "0":
    label: plain
    depth: shallow
    vocabulary: plain
    phrase_hints:
      - rebuild vs new (brief, live rebuild, or both)
      - where the site lives today (URL / DNS / hosting owner)
      - Astro or Next
      - Cloudflare / their host (or own VPS)
      - files vs CMS (markdown collections, headless, keep old CMS)
      - Figma whole file vs few screens
      - what "live" means for them
      - accessibility bar (default WCAG 2.2 AA)
    probes: []
  "1":
    label: plain
    depth: shallow
    vocabulary: plain
    phrase_hints:
